<div
  class="chart-container"
  style="position: relative; height: 350px; width: 350px"
>
  <div style="position: absolute; width: 100%; top: 30px">
    <div class="flex flex-column justify-content-center gap-1">
      <div class="text-center text-xl font-bold">Mood Tracker Journal</div>
      <div class="text-center">Your mood parameters for today.</div>
    </div>
  </div>
  <canvas id="pipeChart" style="width: 100%; height: 50%">{{ chart }}</canvas>

  <div
    class="needle"
    style="
      position: absolute;
      left: calc(50% - 9px);
      top: 75%;
      width: 2px;
      height: 50%;
      rotate: inherit;
      transform: rotate(293deg);
      transform-origin: top left;
      border-left: 50px solid transparent;

      width: 0;
      height: 50%;
      border-left: 0px solid transparent;
      border-right: 180px solid transparent;
      border-top: 15px solid red;
    "
  ></div>
  <div
    style="
      position: absolute;
      left: 50%;
      top: 75%;
      width: 30px;
      height: 30px;
      background-color: red;
      transform-origin: center;
      transform: translate(-50%, -50%);
      border-radius: 50%;
    "
  ></div>
  <div
    class="flex gap-4 justify-content-center align-items-center"
    style="position: absolute; bottom: 20px; width: 100%"
  >
    @for (item of moodList; track item) {
    <div>
      <img width="30px" src="{{ item?.url }}" />
    </div>
    }
  </div>
</div>
