<div class="flex flex-column gap-3">
  @for (item of history; track item) {
  <div
    pAnimateOnScroll
    enterClass="fadeinright"
    leaveClass="fadeoutright"
    class="flex shadow-2 justify-content-center align-items-center h-5rem sm:h-8rem animation-duration-1000 animation-ease-in-out card mb-0 p-3 item-history"
    [style.background-color]="item?.status?.backgroundSelected"
  >
    <div class="flex flex-column gap-1 w-full">
      <div class="flex align-items-center gap-3">
        <div><img width="50px" [src]="item?.status?.url" /></div>
        <div class="flex flex-column gap-1">
          <div class="text-lg font-bold">{{ item?.title }}</div>
          <div>{{ item?.desc }}</div>
        </div>
      </div>
      <div class="text-right text-xs font-italic">
        {{ item?.createdTime | date : "dd.MMM yyyy - HH:mm:ss" }}
      </div>
    </div>
  </div>
  }
</div>
